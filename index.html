<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Malek Hassan</title>
<meta name="description" content="Malek Hassan — AI systems engineer in Berlin. Local-first tools, deterministic guardrails around AI, and commit logs that read like a story.">
<meta property="og:title" content="Malek Hassan">
<meta property="og:description" content="AI systems engineer in Berlin. Twelve projects, one commit log.">
<meta property="og:type" content="website">
<meta property="og:url" content="https://malek1414.github.io">
<meta name="theme-color" content="#000000">
<link rel="icon" href="assets/brand/m-coin.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@600;800&display=swap" rel="stylesheet">
<style>
  /* Values: calm · focused · consistent. Quiet at rest, present on intent.
     Spacing stays on the 4/8 ramp; type uses regular + semibold, display uses one heavy cut. */
  :root {
    --bg: #000;
    --glass: rgba(18, 18, 20, 0.58);
    --glass-strong: rgba(18, 18, 20, 0.78);
    --hair: rgba(255, 255, 255, 0.12);
    --text: #f5f5f7;
    --muted: rgba(245, 245, 247, 0.56);
    --accent: #ff6a2b;            /* court orange — the one accent, used on intent only */
    --ease: cubic-bezier(0.25, 0.1, 0.25, 1);
    --spring: cubic-bezier(0.2, 0.8, 0.2, 1);
    --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Inter", "Segoe UI", sans-serif;
    --display: "Inter Tight", -apple-system, BlinkMacSystemFont, "SF Pro Display", sans-serif;
    --r-outer: 24px;              /* panels float highest */
    --r-inner: 16px;              /* media inside panels */
    --r-control: 999px;           /* pills */
    color-scheme: dark;
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html { scroll-behavior: smooth; -webkit-text-size-adjust: 100%; }
  body {
    font: 400 17px/1.6 var(--font); letter-spacing: -0.012em;
    background: var(--bg); color: var(--text);
    overflow-x: hidden; -webkit-font-smoothing: antialiased;
  }
  ::selection { background: var(--accent); color: #000; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 4px; border-radius: 8px; }

  /* ── stage: a full-screen film of me, behind everything ── */
  #bg { position: fixed; inset: 0; z-index: 0; background: #000; overflow: hidden; }
  #bg .slot { position: absolute; inset: 0; opacity: 0; transition: opacity 900ms var(--ease); }
  #bg .slot.on { opacity: 1; }
  #bg .slot > img, #bg .slot > video { position: absolute; inset: 0; width: 100%; height: 100%; transform: scale(1.04); transition: transform 8s linear; }
  #bg .slot.on > img, #bg .slot.on > video { transform: scale(1); }
  #bg::after {                    /* legibility: a soft vignette, never a flat grey wash */
    content: ""; position: absolute; inset: 0; pointer-events: none;
    background:
      linear-gradient(to bottom, rgba(0,0,0,.55), rgba(0,0,0,.15) 30%, rgba(0,0,0,.25) 65%, rgba(0,0,0,.8)),
      radial-gradient(120% 90% at 50% 50%, transparent 40%, rgba(0,0,0,.5));
  }
  @media (min-width: 901px) {     /* portrait footage on a wide screen: sharp on one half, the page on the dark half */
    #bg .slot.frame-right > img, #bg .slot.frame-right > video { left: 50%; width: 50%; }
    #bg .slot.frame-left > img, #bg .slot.frame-left > video { right: 50%; width: 50%; left: 0; }
    #bg .slot.frame-right, #bg .slot.frame-left { background: #050505; }
    #bg .slot.frame-right::after, #bg .slot.frame-left::after { content: ""; position: absolute; inset: 0; z-index: 1; pointer-events: none; }
    #bg .slot.frame-right::after { background: linear-gradient(to right, #050505 50%, rgba(5,5,5,0) 62%); }
    #bg .slot.frame-left::after { background: linear-gradient(to left, #050505 50%, rgba(5,5,5,0) 62%); }
  }
  .slot { position: relative; overflow: hidden; }
  .slot::before { content: ""; position: absolute; inset: 0; z-index: 1; background: #000; opacity: var(--dim-amt, 0); pointer-events: none; }
  .slot > img, .slot > video { display: block; width: 100%; height: 100%; }

  .skip-link {
    position: absolute; left: 24px; top: -60px; z-index: 50;
    font: 600 14px var(--font); color: #000; background: var(--text);
    padding: 8px 16px; border-radius: var(--r-control); transition: top 200ms var(--ease);
  }
  .skip-link:focus-visible { top: 12px; }

  /* ── header: brand left, nav right; frosted once you scroll ── */
  .site-head, #view, .site-foot { position: relative; z-index: 2; }
  .site-head {
    position: sticky; top: 0; z-index: 20;
    display: flex; align-items: center; justify-content: space-between; gap: 24px;
    padding: 16px max(24px, calc((100vw - 1120px) / 2));
    transition: background 300ms var(--ease), backdrop-filter 300ms var(--ease), border-color 300ms var(--ease);
    border-bottom: 1px solid transparent;
  }
  .site-head.frost { background: rgba(0,0,0,.55); backdrop-filter: saturate(180%) blur(20px); -webkit-backdrop-filter: saturate(180%) blur(20px); border-color: var(--hair); }
  .site-head .brand { display: inline-flex; align-items: center; gap: 12px; color: var(--text); text-decoration: none; font: 600 15px var(--font); letter-spacing: -0.01em; }
  .site-head .brand .mark { width: 24px; height: 24px; background: currentColor;
    -webkit-mask: url(assets/brand/m-mark.svg) center / contain no-repeat; mask: url(assets/brand/m-mark.svg) center / contain no-repeat; }
  .site-head nav { display: flex; gap: 8px; }
  .site-head nav a {
    font: 400 14px var(--font); color: var(--muted); text-decoration: none;
    padding: 6px 12px; border-radius: var(--r-control); transition: color 200ms var(--ease), background 200ms var(--ease);
  }
  .site-head nav a:hover, .site-head nav a:focus-visible { color: var(--text); background: rgba(255,255,255,.08); }
  .site-head nav a[aria-current] { color: var(--text); }

  /* ── column ── */
  .col { max-width: 1120px; margin-inline: auto; padding-inline: 24px; }
  #view { padding: 0 0 96px; }

  /* ── panels (the old boxes, now glass over film) ── */
  .box {
    background: var(--glass);
    backdrop-filter: saturate(160%) blur(28px); -webkit-backdrop-filter: saturate(160%) blur(28px);
    border: 1px solid var(--hair); border-radius: var(--r-outer);
    padding: 40px; max-width: 760px;
    transition: border-color 300ms var(--ease);
  }
  .box:hover { border-color: rgba(255,255,255,.2); }
  .scene { min-height: 100svh; display: flex; align-items: center; padding-block: 96px; }
  .scene.right { justify-content: flex-end; }
  .eyebrow { display: block; font: 600 12px var(--font); letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); margin-bottom: 24px; }
  .eyebrow .tilde { color: var(--accent); }
  h1, h2, .display { font-family: var(--display); font-weight: 800; letter-spacing: -0.03em; line-height: 0.92; text-transform: uppercase; }
  .muted { color: var(--muted); }

  /* ── links & buttons ── */
  .link { color: var(--text); text-decoration: none; background-image: linear-gradient(currentColor, currentColor);
    background-repeat: no-repeat; background-size: 0% 1px; background-position: 0 100%; transition: background-size 250ms var(--ease); padding-bottom: 2px; }
  .link:hover, .link:focus-visible { background-size: 100% 1px; }
  .btn {
    display: inline-flex; align-items: center; gap: 8px;
    font: 600 15px var(--font); color: var(--text); text-decoration: none;
    background: rgba(255,255,255,.1); border: 1px solid var(--hair); border-radius: var(--r-control);
    padding: 12px 20px; cursor: pointer;
    transition: background 200ms var(--ease), transform 200ms var(--spring), color 200ms var(--ease);
  }
  .btn:hover, .btn:focus-visible { background: rgba(255,255,255,.18); transform: translateY(-1px); }
  .btn.primary { background: var(--text); color: #000; border-color: transparent; }
  .btn.primary:hover { background: #fff; }
  .btn svg { width: 16px; height: 16px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
  .btn .fill-mark { fill: currentColor; stroke: none; }

  /* ── intro: the name leads, the panel supports, the film sits beside ── */
  .intro { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 40px; align-items: end; width: 100%; }
  .intro h1 { font-size: clamp(64px, 11vw, 168px); margin-bottom: 32px; text-shadow: 0 2px 40px rgba(0,0,0,.35); }
  .intro .box { max-width: 560px; }
  .role { font: 600 21px/1.3 var(--font); letter-spacing: -0.02em; }
  .log { font: 600 13px var(--font); letter-spacing: 0.02em; color: var(--accent); margin-top: 8px; }
  .bio { margin-top: 16px; color: rgba(245,245,247,.86); }
  .intro-links { display: flex; flex-wrap: wrap; gap: 8px 20px; margin-top: 24px; font-size: 15px; }
  .film-card { position: relative; width: clamp(240px, 24vw, 340px); aspect-ratio: 9 / 16; border-radius: var(--r-outer); overflow: hidden;
    border: 1px solid var(--hair); background: #000; box-shadow: 0 40px 80px rgba(0,0,0,.5); }
  .film-card video { width: 100%; height: 100%; object-fit: cover; display: block; }
  .film-card .play {
    position: absolute; left: 16px; right: 16px; bottom: 16px; z-index: 2; justify-content: center;
    background: rgba(255,255,255,.16); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
  }
  .film-card.playing .play { opacity: 0; pointer-events: none; }
  .tri { width: 0; height: 0; border-left: 10px solid currentColor; border-top: 6px solid transparent; border-bottom: 6px solid transparent; }
  .scroll-cue { position: absolute; left: 50%; bottom: 24px; transform: translateX(-50%); font: 600 12px var(--font); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }

  /* ── project rows (unchanged behaviour: hover recedes siblings; also swaps the film) ── */
  .rows-box { max-width: 880px; }
  @media (min-width: 901px) { .rows-box { max-width: min(640px, 48vw); } }
  .rows-box h2, .scene h2 { font-size: clamp(40px, 6vw, 80px); margin-bottom: 24px; }
  .row {
    display: flex; align-items: baseline; gap: 20px;
    padding: 16px 16px; margin-inline: -16px; border-radius: 16px; text-decoration: none; color: var(--text);
    transition: background 250ms var(--ease), opacity 300ms var(--ease);
  }
  .row:hover, .row:focus-visible { background: rgba(255,255,255,.08); }
  @media (hover: hover) { .box:has(.row:hover) .row:not(:hover) { opacity: .4; } }
  .row .idx { font: 600 13px var(--font); color: var(--muted); flex: none; width: 28px; font-variant-numeric: tabular-nums; }
  .row:hover .idx, .row:focus-visible .idx { color: var(--accent); }
  .row .row-body { flex: 1; min-width: 0; }
  .row .row-title { display: block; font: 800 24px/1.1 var(--display); letter-spacing: -0.02em; text-transform: uppercase; }
  .row .row-sub { display: block; font-size: 15px; line-height: 1.45; color: var(--muted); margin-top: 4px; }
  .row .row-year { font: 400 13px var(--font); color: var(--muted); flex: none; font-variant-numeric: tabular-nums; }
  .row .row-arrow { flex: none; color: var(--muted); transition: transform 250ms var(--spring), color 200ms var(--ease); }
  .row:hover .row-arrow, .row:focus-visible .row-arrow { transform: translateX(4px); color: var(--text); }

  /* ── media inside panels ── */
  .media { margin-top: 24px; }
  .media video, .media img { width: 100%; border-radius: var(--r-inner); border: 1px solid var(--hair); display: block; background: #000; }
  .media.portrait video, .media.portrait img { max-height: 600px; width: auto; max-width: 100%; margin-inline: auto; object-fit: contain; }
  .media figcaption { font-size: 13px; color: var(--muted); margin-top: 12px; }

  /* ── milestones, skills, contact ── */
  .mrow { display: flex; gap: 20px; align-items: baseline; padding: 16px 0; border-top: 1px solid var(--hair); }
  .mrow:first-of-type { border-top: 0; }
  .mrow .mdate { font: 600 13px var(--font); color: var(--muted); flex: none; width: 72px; font-variant-numeric: tabular-nums; }
  .mrow .mtitle { display: block; font: 600 16px/1.35 var(--font); letter-spacing: -0.015em; }
  .mrow .msub { display: block; font-size: 15px; color: var(--muted); margin-top: 2px; }
  .skill-line { padding: 12px 0; font-size: 16px; color: rgba(245,245,247,.8); border-top: 1px solid var(--hair); }
  .skill-line:first-of-type { border-top: 0; }
  .skill-line .area { display: block; font: 600 12px var(--font); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin-bottom: 4px; }

  .contact-links { display: flex; flex-wrap: wrap; gap: 12px; }
  .contact-links .btn span { white-space: nowrap; }

  /* ── framing rails (kept from the old site) ── */
  .social-rail, .email-rail { position: fixed; bottom: 0; z-index: 3; display: flex; flex-direction: column; align-items: center; gap: 20px; }
  .social-rail { left: max(24px, calc((100vw - 1240px) / 2)); }
  .email-rail { right: max(24px, calc((100vw - 1240px) / 2)); }
  .social-rail::after, .email-rail::after { content: ""; width: 1px; height: 56px; margin-bottom: 24px; border-radius: 1px; background: linear-gradient(to bottom, rgba(255,255,255,0), rgba(255,255,255,.32) 45%, rgba(255,255,255,0)); }
  .social-rail a { display: grid; place-items: center; padding: 8px; color: var(--muted); transition: color 200ms var(--ease), transform 250ms var(--spring); }
  .social-rail a:hover, .social-rail a:focus-visible { color: var(--text); transform: translateY(-2px); }
  .social-rail svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
  .social-rail .fill-mark { fill: currentColor; stroke: none; }
  .email-rail a { writing-mode: vertical-rl; text-decoration: none; padding: 8px; font: 400 12px var(--font); letter-spacing: .1em; color: var(--muted); transition: color 200ms var(--ease), transform 250ms var(--spring); }
  .email-rail a:hover, .email-rail a:focus-visible { color: var(--text); transform: translateY(-2px); }

  /* ── project detail: a calm reading panel over that project's film ── */
  .detail { padding-top: 96px; }
  .detail .box { max-width: 760px; margin-inline: auto; background: var(--glass-strong); }
  @media (min-width: 901px) { .detail:not(.wide) .box { max-width: min(680px, 48vw); margin-inline: 0 auto; } }
  .back { display: inline-flex; align-items: center; gap: 8px; font: 400 15px var(--font); color: var(--muted); text-decoration: none; margin-bottom: 32px; }
  .back .arr { transition: transform 250ms var(--spring); }
  .back:hover, .back:focus-visible { color: var(--text); }
  .back:hover .arr { transform: translateX(-3px); }
  .detail h1 { font-size: clamp(44px, 7vw, 88px); }
  .detail-meta { font: 600 13px var(--font); color: var(--muted); margin-top: 16px; }
  .detail-meta .tag { color: var(--accent); }
  .para { margin-top: 20px; color: rgba(245,245,247,.88); }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 32px; }
  .chip { font: 400 13px var(--font); color: rgba(245,245,247,.8); background: rgba(255,255,255,.08); border-radius: var(--r-control); padding: 6px 12px; }
  .proj-links { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 32px; }
  .pn { margin-top: 48px; border-top: 1px solid var(--hair); padding-top: 16px; }
  .pn .idx { width: 40px; }
  .pn .row-title { font-size: 20px; }

  /* ── me gallery ── */
  .gallery { display: grid; grid-template-columns: repeat(3, 1fr); grid-auto-rows: 160px; grid-auto-flow: dense; gap: 12px; margin-top: 32px; }
  .gcell { position: relative; grid-row: span 2; border-radius: var(--r-inner); overflow: hidden; margin: 0; background: #111; }
  .gcell.tall { grid-row: span 3; }
  .gcell .slot { position: absolute; inset: 0; }
  .gcell .slot > img, .gcell .slot > video { object-fit: cover; transition: transform 800ms var(--spring); }
  .gcell:hover .slot > img { transform: scale(1.04); }
  .gcell .gcap { position: absolute; left: 12px; bottom: 12px; z-index: 2; font: 600 13px var(--font); opacity: 0; transform: translateY(4px); transition: opacity 300ms var(--ease), transform 300ms var(--ease); text-shadow: 0 1px 12px rgba(0,0,0,.6); }
  .gcell:hover .gcap, .gcell:focus-within .gcap { opacity: 1; transform: none; }
  .detail.wide .box { max-width: 1040px; }

  /* ── reveal & view transitions ── */
  .reveal { opacity: 0; transform: translateY(24px); transition: opacity 700ms var(--ease), transform 700ms var(--spring); }
  .reveal.in { opacity: 1; transform: none; }
  #view.leaving { opacity: 0; transition: opacity 180ms var(--ease); }
  #view.entering { animation: enter 400ms var(--spring); }
  @keyframes enter { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: none; } }

  .site-foot { max-width: 1120px; margin-inline: auto; padding: 0 24px 48px; font-size: 13px; color: var(--muted); display: flex; justify-content: space-between; gap: 16px; }

  /* ── slot mode (?slots) ── */
  .slots-on [data-slot] { outline: 1px dashed var(--accent); outline-offset: -1px; }
  .slot-panel { position: fixed; left: 12px; bottom: 12px; z-index: 70; width: min(440px, calc(100vw - 24px)); max-height: 60vh; overflow: auto;
    background: rgba(17,17,17,.94); backdrop-filter: blur(20px); color: #eee; border: 1px solid var(--hair); border-radius: 16px; padding: 16px; font: 12px/1.5 ui-monospace, Menlo, monospace; }
  .slot-panel b { color: var(--accent); }
  .slot-panel .now { margin-top: 8px; padding: 8px; border-radius: 8px; background: rgba(255,255,255,.06); }
  .slot-panel pre { white-space: pre-wrap; word-break: break-all; margin-top: 8px; color: #ccc; }
  .slot-panel button { margin-top: 8px; margin-right: 8px; background: var(--text); color: #000; border: 0; border-radius: 999px; padding: 6px 12px; font: 600 12px var(--font); cursor: pointer; }
  .slot-drop { position: fixed; inset: 0; z-index: 69; display: none; place-items: center; background: rgba(0,0,0,.5); border: 3px dashed var(--accent); font: 600 20px var(--font); }
  .slot-drop.show { display: grid; }

  @media (max-width: 900px) {
    .intro { grid-template-columns: 1fr; gap: 24px; }
    .intro > div:first-child { display: contents; }   /* phone order: name, film, then the panel */
    .intro h1 { order: 1; font-size: 22vw; margin-bottom: 0; }
    .film-card { order: 2; width: 100%; max-width: 420px; justify-self: center; }
    .intro .box { order: 3; }
  }
  @media (max-width: 720px) {
    body { font-size: 16px; }
    .box { padding: 28px 24px; border-radius: 20px; }
    .scene { min-height: auto; padding-block: 64px; }
    .scene.intro-scene { min-height: 100svh; padding-top: 24px; }
    .site-head { padding: 12px 16px; }
    .site-head nav { gap: 0; }
    .site-head nav a { padding: 6px 8px; font-size: 13px; }
    .site-head .brand span:last-child { display: none; }
    .row .row-year { display: none; }
    .row .row-title { font-size: 20px; }
    .gallery { grid-template-columns: repeat(2, 1fr); grid-auto-rows: 120px; gap: 8px; }
    .scroll-cue { display: none; }
  }
  @media (max-width: 1020px) { .social-rail, .email-rail { display: none; } }

  @media (prefers-reduced-motion: reduce) {
    html { scroll-behavior: auto; }
    .reveal { opacity: 1; transform: none; transition: none; }
    #view.leaving, #view.entering { animation: none; transition: none; opacity: 1; transform: none; }
    #bg .slot, #bg .slot > img, #bg .slot > video { transition: none; transform: none; }
    .row .row-arrow, .btn, .social-rail a, .email-rail a { transition: none; }
    .box:has(.row:hover) .row:not(:hover) { opacity: 1; }
  }
</style>
</head>
<body>
<div id="bg" aria-hidden="true"></div>
<a class="skip-link" href="#view">Skip to content</a>

<header class="site-head" id="head">
  <a class="brand" href="#/"><span class="mark" aria-hidden="true"></span><span>Malek Hassan</span></a>
  <nav aria-label="Sections">
    <a href="#projects">Projects</a>
    <a href="#milestones">Milestones</a>
    <a href="#/me">Me</a>
    <a href="#contact">Contact</a>
  </nav>
</header>

<main id="view" aria-live="polite"></main>

<footer class="site-foot"><span>© 2026 Malek Hassan · built by hand, one file</span><span>Berlin</span></footer>
<aside id="socialRail" class="social-rail" aria-label="Social profiles"></aside>
<aside id="emailRail" class="email-rail" aria-label="Email"></aside>

<script>
'use strict';

/* ════════════════════════════════════════════════════════════════════════════
   MEDIA — every picture and video that plays behind the site, in one place.
   Swap one by changing its `src` (and `poster` for videos). Nothing else changes.
   Open the site with ?slots to see which film is on screen right now and to drop
   a file onto the page to try it there before you commit to it.

   src      image or video (.jpg .png .webp / .mp4 .webm .mov); videos play muted and looped
   poster   still shown before a video starts, and instead of it with reduced motion
   fit      'cover' (fill the screen, crop) or 'contain'
   position focal point when cropping: '50% 30%' keeps the upper middle in frame
   dim      0–1, extra darkening on top of the standard vignette
   frame    'right' or 'left': on wide screens, show portrait footage sharp on that half
            and keep the other half dark for the text (phones always fill the screen)
   Make a loop from any video:  scripts/make-loop.sh in.mov <start> <seconds> <name>
   ════════════════════════════════════════════════════════════════════════════ */
const MEDIA = {
  // The intro film in the first panel: the tight cut of video 1, 9:16, with sound.
  'film.intro':    { src: 'assets/film/intro-web.mp4', poster: 'assets/loops/reel-01-intro.jpg', length: '3:28' },

  // Behind each section of the home page, in scroll order. Graded with R2R's looks

// ── helpers ──
const REDUCED = matchMedia('(prefers-reduced-motion: reduce)').matches;
const SLOTS_MODE = new URLSearchParams(location.search).has('slots');
const tried = {};   // slot mode: files dropped this session, by slot key
function esc(s) {
  return String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}
const isVideo = src => /\.(mp4|webm|mov|m4v)(\?|$)/i.test(src || '') || /^blob:.*#video$/.test(src || '');

// One renderer for every slot, so swapping a file never touches layout.
function slotInner(spec) {
  const style = `object-fit:${spec.fit || 'cover'};object-position:${spec.position || '50% 50%'}`;
  const src = innerWidth < 720 && spec.srcSm ? spec.srcSm : spec.src;
  if (isVideo(src)) {
    return `<video muted playsinline loop autoplay preload="metadata" poster="${esc(spec.poster || '')}" src="${esc(src)}" style="${style}"></video>`;
  }
  return `<img src="${esc(src)}" alt="" style="${style}">`;
}

// Low Power Mode, data savers and "never autoplay" settings refuse play() until the visitor
// interacts. Remember the refused videos and start them on the first tap, click or key.
const waiting = new Set();
function tryPlay(v) {
  if (!v) return;
  v.muted = true;            // the property, not just the attribute: what autoplay policies check
  const p = v.play();
  if (p) p.catch(() => waiting.add(v));
}
function resumeWaiting() {
  waiting.forEach(v => { if (v.isConnected && v.closest('.slot.on')) v.play().then(() => waiting.delete(v), () => {}); });
}
['pointerdown', 'touchend', 'click', 'keydown'].forEach(t => addEventListener(t, resumeWaiting, { passive: true }));
document.addEventListener('visibilitychange', () => { if (!document.hidden) tryPlay(document.querySelector('#bg .slot.on video')); });

function slotHTML(key, spec, cls = '') {
  return `<div class="slot ${cls}${spec.frame ? ' frame-' + spec.frame : ''}" data-slot="${esc(key)}" style="--dim-amt:${spec.dim || 0}">${slotInner(spec)}</div>`;
}

// ── STAGE: the full-screen film; one slot on at a time, crossfaded ──
const bg = document.getElementById('bg');
let bgKey = null, bgSection = null, bgHover = null;
function setBg(key) {
  if (!MEDIA[key] || key === bgKey) return;
  bgKey = key;
  let el = bg.querySelector(`[data-slot="${CSS.escape(key)}"]`);
  if (!el) { bg.insertAdjacentHTML('beforeend', slotHTML(key, MEDIA[key])); el = bg.lastElementChild; }
  bg.querySelectorAll('.slot').forEach(s => {
    const on = s === el;
    const v = s.querySelector('video');
    if (on) { requestAnimationFrame(() => s.classList.add('on')); tryPlay(v); }
    else { s.classList.remove('on'); if (v) setTimeout(() => { if (!s.classList.contains('on')) v.pause(); }, 900); }
  });
  if (SLOTS_MODE) slotPanel();
}
const showBg = () => setBg(bgHover || bgSection);

// Sections declare their film with data-bg; whichever fills most of the screen wins.
let sectionIO = null;
function watchSections(root) {
  sectionIO?.disconnect();
  const seen = new Map();
  sectionIO = new IntersectionObserver(entries => {
    entries.forEach(e => seen.set(e.target, e.intersectionRatio));
    let best = null, ratio = 0;
    seen.forEach((r, el) => { if (r > ratio) { ratio = r; best = el; } });
    if (best) { bgSection = best.dataset.bg; showBg(); }
  }, { threshold: [0, .15, .3, .5, .7, .9] });
  root.querySelectorAll('[data-bg]').forEach(s => sectionIO.observe(s));
}

// ── RENDERERS (same structure as the live site) ──
function mediaFigure(md) {
  const cls = md.portrait ? 'media portrait' : 'media';
  const body = isVideo(md.src)
    ? `<video controls preload="none" playsinline poster="${esc(md.poster || '')}" src="${esc(md.src)}"></video>`
    : `<img loading="lazy" src="${esc(md.src)}" alt="${esc(md.caption || '')}">`;
  return `<figure class="${cls}">${body}${md.caption ? `<figcaption>${esc(md.caption)}</figcaption>` : ''}</figure>`;
}

        <a class="btn" href="${esc(c.github)}" target="_blank" rel="noreferrer">${SOCIAL_ICONS.github}<span>GitHub</span></a>

function mountReveal() {
  const boxes = document.querySelectorAll('.reveal');
  if (REDUCED) { boxes.forEach(b => b.classList.add('in')); return; }
  const io = new IntersectionObserver(entries => {
    entries.forEach(e => { if (e.isIntersecting) { e.target.classList.add('in'); io.unobserve(e.target); } });
  }, { threshold: 0.12 });
  boxes.forEach(b => io.observe(b));
}

function mountHome() {
  mountReveal();
  watchSections(view);
  // hovering (or focusing) a project row swaps the film to that project
  document.querySelectorAll('[data-work]').forEach(a => {
    const on = () => { bgHover = 'work.' + a.dataset.work; showBg(); };
    a.addEventListener('mouseenter', on);
    a.addEventListener('focus', on);
  });
  const rows = document.querySelector('.rows-box');
  const off = () => { bgHover = null; showBg(); };
  rows.addEventListener('mouseleave', off);
  rows.addEventListener('focusout', e => { if (!rows.contains(e.relatedTarget)) off(); });
  // the intro film plays inline with sound; the button disappears while it plays
  const card = document.getElementById('introFilm'), v = card.querySelector('video');
  card.querySelector('.play').addEventListener('click', () => { v.controls = true; v.muted = false; v.play(); });
  v.addEventListener('play', () => card.classList.add('playing'));
  v.addEventListener('pause', () => { if (v.currentTime < 0.2 || v.ended) card.classList.remove('playing'); });
}

function renderMe() {

// ── ROUTER (as on the live site) ──
const view = document.getElementById('view');
let homeScrollY = 0;
let currentKind = null; // 'home' | 'project' | 'me'

function routeTarget() {
  const raw = location.hash;
  if (raw === '' || raw === '#' || raw === '#/') return { kind: 'home' };
  if (raw === '#/me') return { kind: 'me' };
  if (raw.startsWith('#/')) {
    const i = SITE.projects.findIndex(p => p.slug === raw.slice(2));
    return i >= 0 ? { kind: 'project', i } : { kind: 'invalid' };
  }
  return { kind: 'anchor', id: raw.slice(1) };
}

function applyRoute() {
  const t = routeTarget();
  if (t.kind === 'invalid') { location.replace('#/'); return; }

  if (t.kind === 'anchor') {
    if (document.getElementById(t.id)) return; // browser handles in-page jump
    view.innerHTML = renderHome();
    mountHome();
    currentKind = 'home';
    document.title = 'Malek Hassan';
    requestAnimationFrame(() => document.getElementById(t.id)?.scrollIntoView());
    if (SLOTS_MODE) slotPanel();
    return;
  }

  if (currentKind === 'home' && (t.kind === 'project' || t.kind === 'me')) homeScrollY = scrollY;

  const swap = () => {
    bgHover = null;
    sectionIO?.disconnect();
    if (t.kind === 'home') {
      view.innerHTML = renderHome();
      mountHome();
      document.title = 'Malek Hassan';
      const y = homeScrollY;
      requestAnimationFrame(() => scrollTo({ top: y, left: 0, behavior: 'instant' }));
      currentKind = 'home';
    } else if (t.kind === 'me') {
      view.innerHTML = renderMe();
      mountReveal();
      bgSection = 'bg.me'; showBg();
      document.title = 'Malek Hassan — Me';
      requestAnimationFrame(() => scrollTo({ top: 0, left: 0, behavior: 'instant' }));
      currentKind = 'me';
    } else {
      view.innerHTML = renderProject(t.i);
      bgSection = 'work.' + SITE.projects[t.i].slug; showBg();
      document.title = 'Malek Hassan — ' + SITE.projects[t.i].title;
      requestAnimationFrame(() => scrollTo({ top: 0, left: 0, behavior: 'instant' }));
      currentKind = 'project';
    }
    if (SLOTS_MODE) slotPanel();
  };

  document.querySelectorAll('.site-head nav a').forEach(a => {
    const me = a.getAttribute('href') === '#/me';
    a.toggleAttribute('aria-current', me ? t.kind === 'me' : false);
  });

  if (REDUCED || currentKind === null) { swap(); return; }
  view.classList.add('leaving');
  setTimeout(() => {
    view.classList.remove('leaving');
    swap();
    view.classList.add('entering');
    setTimeout(() => view.classList.remove('entering'), 400);
  }, 180);
}

if ('scrollRestoration' in history) history.scrollRestoration = 'manual';
addEventListener('hashchange', applyRoute);
applyRoute();

// ── HEADER: clear over the film, frosted once you scroll ──
(() => {
  const head = document.getElementById('head');
  const set = () => head.classList.toggle('frost', scrollY > 24);
  addEventListener('scroll', set, { passive: true }); set();
})();

// ── SLOT MODE (?slots): name the film on screen, drop a file to try it in place ──
function slotPanel() {
  document.documentElement.classList.add('slots-on');
  let p = document.querySelector('.slot-panel');
  if (!p) {
    p = document.createElement('div'); p.className = 'slot-panel'; document.body.append(p);
    const veil = document.createElement('div'); veil.className = 'slot-drop'; veil.textContent = 'Drop to try it behind the page'; document.body.append(veil);
    addEventListener('dragover', e => { e.preventDefault(); veil.classList.add('show'); });
    addEventListener('dragleave', e => { if (!e.relatedTarget) veil.classList.remove('show'); });
    addEventListener('drop', e => {
      e.preventDefault(); veil.classList.remove('show');
      const f = e.dataTransfer.files[0]; if (!f) return;
      const slotEl = e.target.closest?.('[data-slot]:not(#bg *)');
      const key = slotEl?.dataset.slot || bgKey;
      const url = URL.createObjectURL(f) + (f.type.startsWith('video') ? '#video' : '');
      tried[key] = f.name;
      if (MEDIA[key]) {
        MEDIA[key] = { ...MEDIA[key], src: url, poster: '' };
        bg.querySelector(`[data-slot="${CSS.escape(key)}"]`)?.remove();
        if (key === 'film.intro') { const v = document.querySelector('#introFilm video'); if (v) v.src = url; }
        bgKey = null; showBg();
      } else if (slotEl) {
        slotEl.innerHTML = slotInner({ src: url, fit: 'cover' });
        slotEl.querySelector('video')?.play().catch(() => {});
      }
      slotPanel();
    });
  }
  const edits = Object.keys(tried).map(k => k.startsWith('SITE.')
    ? `${k}.src = 'assets/me/${tried[k]}'`
    : `MEDIA['${k}'].src = 'assets/loops/${tried[k]}'`).join('\n');
  p.innerHTML = `<b>Slot mode</b> · nothing is saved
    <div class="now">Behind the page now: <b>${esc(bgKey || '—')}</b><br>${esc(MEDIA[bgKey]?.src || '')}</div>
    <div style="margin-top:8px">Scroll or hover a project to change it. Drop an image or video anywhere to try it in that slot. Gallery photos and the intro film are dashed; drop onto one to try it there.</div>
    ${edits ? `<pre>${esc(edits)}</pre><button type="button" id="slotCopy">Copy edits</button>` : ''}`;
  document.getElementById('slotCopy')?.addEventListener('click', () => navigator.clipboard?.writeText(edits));
}
</script>
