    --panel: rgba(8, 8, 10, 0.72);
    --border: rgba(255, 255, 255, 0.08);
    --text: #ededf0;
    --muted: #9b9ba3;
    --accent: #8B5CF6;
    --accent-deep: #5B21B6;
    --ease: cubic-bezier(0.2, 0, 0, 1);
    --font: -apple-system, BlinkMacSystemFont, Inter, "Segoe UI", sans-serif;

  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  html { scroll-behavior: smooth; }
  body {
    font-family: var(--font);
    background: var(--bg);
    color: var(--text);
    line-height: 1.65;
    font-size: 16px;
    overflow-x: hidden;
    -webkit-font-smoothing: antialiased;
  }

  ::selection { background: rgba(91, 33, 182, 0.4); color: var(--text); }

  /* ── stage layers ── */
  #bgCanvas {
    position: fixed; inset: 0;
    width: 100%; height: 100%;
    z-index: 0; pointer-events: none;
  }
  #spotlight {
    position: fixed; inset: 0;
    z-index: 1; pointer-events: none;
    background: radial-gradient(600px circle at var(--mx, 50vw) var(--my, 30vh),
                rgba(139, 92, 246, 0.12), transparent 70%);
  }
  @media (hover: none) { #spotlight { display: none; } }

  /* WebGL-unavailable fallback: static purple edge vignette */
  html.no-gl #bgCanvas { display: none; }
  html.no-gl body::before {
    content: ""; position: fixed; inset: 0; z-index: 0; pointer-events: none;
    background:
      linear-gradient(to right,  rgba(91,33,182,0.14), transparent 180px, transparent calc(100% - 180px), rgba(91,33,182,0.14)),
      linear-gradient(to bottom, rgba(91,33,182,0.10), transparent 180px, transparent calc(100% - 180px), rgba(91,33,182,0.10));
  }

  /* ── column ── */
  .site-head, #view, .site-foot { position: relative; z-index: 2; }

  .col { max-width: 680px; margin-inline: auto; padding-inline: 24px; }

  .skip-link {
    position: absolute; left: 24px; top: -48px; z-index: 10;
    font: 500 13px var(--mono); color: var(--text);
    background: var(--accent-deep); padding: 8px 14px; border-radius: 8px;
    transition: top 180ms var(--ease);
  }
  .skip-link:focus-visible { top: 12px; }

  .site-head {
    display: flex; align-items: baseline; justify-content: space-between;
    max-width: 680px; margin-inline: auto; padding: 40px 24px 0;
  }
  .site-head .brand {
    font: 600 15px/1 var(--font); letter-spacing: -0.01em;
    color: var(--text); text-decoration: none;
  }
  .site-head nav { display: flex; gap: 22px; }
  .site-head nav a {
    font: 400 12.5px var(--mono); letter-spacing: 0.02em;
    color: var(--muted); text-decoration: none;
    transition: color 200ms var(--ease);
  }
  .site-head nav a:hover, .site-head nav a:focus-visible { color: var(--accent); }

  /* ── boxes ── */
  .box {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 36px;
    transition: border-color 300ms var(--ease);
  }
  .box:hover { border-color: rgba(139, 92, 246, 0.25); }
  .box + .box { margin-top: 96px; }
  #view { padding: 96px 0 64px; }

  .eyebrow {
    font: 400 12px var(--mono); letter-spacing: 0.04em;
    color: var(--muted); display: block; margin-bottom: 18px;
  }
  .eyebrow .tilde { color: var(--accent); }

  h1 {
    font-size: 30px; font-weight: 650; letter-spacing: -0.02em;
    line-height: 1.2; color: var(--text);
  }
  h2 { font-size: 17px; font-weight: 600; letter-spacing: -0.01em; }
  .muted { color: var(--muted); }
  .mono { font-family: var(--mono); }

  /* ── links & buttons ── */
  .link {
    color: var(--text); text-decoration: none;
    background-image: linear-gradient(var(--accent), var(--accent));
    background-repeat: no-repeat; background-size: 0% 1px; background-position: 0 100%;
    transition: background-size 180ms var(--ease), color 180ms var(--ease);
    padding-bottom: 1px;
  }
  .link:hover, .link:focus-visible { background-size: 100% 1px; color: var(--text); }

  .btn {
    display: inline-block; font: 500 13.5px var(--font);
    color: var(--text); text-decoration: none;
    border: 1px solid var(--border); border-radius: 10px;
    padding: 9px 16px;
    transition: background 200ms var(--ease), transform 200ms var(--ease), border-color 200ms var(--ease);
  }
  .btn:hover, .btn:focus-visible {
    background: rgba(91, 33, 182, 0.2);
    border-color: rgba(139, 92, 246, 0.35);
    transform: translateY(-2px);
  }

  /* ── project / milestone rows ── */
  .row {
    display: flex; align-items: baseline; gap: 16px;
    padding: 14px 12px; margin-inline: -12px;
    border-radius: 10px; text-decoration: none;
    transition: background 200ms var(--ease);
  }
  .row:hover, .row:focus-visible { background: rgba(139, 92, 246, 0.06); }
  .row .idx {
    font: 400 12px var(--mono); color: var(--muted); flex: none; width: 22px;
    transition: color 200ms var(--ease);
  }
  .row:hover .idx, .row:focus-visible .idx { color: var(--accent); }
  .row .row-body { flex: 1; min-width: 0; }
  .row .row-title {
    display: block; font-weight: 600; font-size: 15px; letter-spacing: -0.01em;
    color: var(--muted); transition: color 200ms var(--ease);
  }
  .row:hover .row-title, .row:focus-visible .row-title { color: var(--text); }
  .row .row-sub {
    display: block; font-size: 13.5px; color: var(--muted);
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;

  .row .row-year { font: 400 12px var(--mono); color: var(--muted); flex: none; }
  .row .row-arrow {
    flex: none; color: var(--muted);
    transition: transform 200ms var(--ease), color 200ms var(--ease);
  }
  .row:hover .row-arrow, .row:focus-visible .row-arrow {
    transform: translateX(4px); color: var(--accent);
  }

  /* ── media ── */
  .media { margin-top: 20px; }
  .media video, .media img {
    width: 100%; border-radius: 12px; border: 1px solid var(--border); display: block;

  .media.portrait video, .media.portrait img {
    max-height: 560px; width: auto; margin-inline: auto; object-fit: contain;

  .media figcaption { font: 400 12px var(--mono); color: var(--muted); margin-top: 10px; }

  /* ── home sections ── */
  .role { color: var(--muted); margin-top: 6px; font-size: 15px; }
  .log { font: 400 12.5px var(--mono); color: var(--accent); letter-spacing: 0.02em; margin-top: 14px; }
  .bio { margin-top: 18px; color: var(--text); }
  .intro-links { display: flex; flex-wrap: wrap; gap: 18px; margin-top: 22px; }
  .intro-links a { font: 400 12.5px var(--mono); }

  /* Social rail concept adapted from Brittany Chiang's portfolio; icons and styling are original here. */
  .social-rail {
    position: fixed; left: max(24px, calc((100vw - 1120px) / 2)); bottom: 0; z-index: 3;
    display: flex; flex-direction: column; align-items: center; gap: 18px;
  }
  .social-rail::after { content: ""; width: 1px; height: 76px; background: var(--border); }
  .social-rail a {
    display: grid; place-items: center; width: 34px; height: 34px;
    color: var(--muted); border: 1px solid transparent; border-radius: 10px;
    transition: color 200ms var(--ease), transform 200ms var(--ease), border-color 200ms var(--ease), background 200ms var(--ease);

  .social-rail a:hover, .social-rail a:focus-visible {

  .mrow { display: flex; gap: 16px; align-items: baseline; padding: 12px 0; border-top: 1px solid var(--border); }
  .mrow:first-of-type { border-top: 0; }
  .mrow .mdate { font: 400 12px var(--mono); color: var(--muted); flex: none; width: 64px; }
  .mrow .mtitle { display: block; font-weight: 600; font-size: 14.5px; letter-spacing: -0.01em; }
  .mrow .msub { display: block; font-size: 13.5px; color: var(--muted); }

  .skill-line .area { font: 400 12px var(--mono); color: var(--text); display: block; margin-bottom: 2px; }
  .skill-line .area::before { content: "— "; color: var(--accent); }

  .contact-links { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 24px; }

  /* ── project detail ── */
  .back { display: inline-block; font: 400 12.5px var(--mono); color: var(--muted); text-decoration: none; margin-bottom: 28px; }
  .back .arr { display: inline-block; transition: transform 200ms var(--ease); }
  .back:hover, .back:focus-visible { color: var(--text); }

  .para { margin-top: 18px; color: var(--text); }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 26px; }
  .chip { font: 400 12px var(--mono); color: var(--muted); border: 1px solid var(--border); border-radius: 999px; padding: 4px 11px; }
  .proj-links { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 26px; }
  .pn { margin-top: 40px; border-top: 1px solid var(--border); padding-top: 16px; }
  .pn .idx { width: 40px; }

  /* ── me gallery ── */
  .gallery { display: grid; grid-template-columns: repeat(2, 1fr); grid-auto-rows: 150px; grid-auto-flow: dense; gap: 14px; margin-top: 26px; }
  .gcell { position: relative; grid-row: span 2; border-radius: 12px; overflow: hidden; border: 1px solid var(--border); background: #000; margin: 0; }
  .gcell.tall { grid-row: span 3; }
  .gcell img { width: 100%; height: 100%; object-fit: cover; display: block; transition: transform 600ms var(--ease); }
  .gcell::after { content: ""; position: absolute; inset: 0; background: linear-gradient(to top, rgba(5,5,5,0.6), transparent 45%); opacity: 0; transition: opacity 300ms var(--ease); }
  .gcell:hover img { transform: scale(1.04); }
  .gcell:hover::after { opacity: 1; }
  .gcell .gcap { position: absolute; left: 12px; bottom: 10px; z-index: 1; font: 400 11.5px var(--mono); color: var(--text); opacity: 0; transform: translateY(4px); transition: opacity 300ms var(--ease), transform 300ms var(--ease); }
  .gcell:hover .gcap, .gcell:focus-within .gcap { opacity: 1; transform: none; }
  @media (max-width: 720px) { .gallery { grid-auto-rows: 110px; gap: 10px; } }

  /* ── reveal & view transitions ── */
  .reveal { opacity: 0; transform: translateY(8px); transition: opacity 500ms var(--ease), transform 500ms var(--ease); }
  .reveal.in { opacity: 1; transform: none; }

  #view.leaving { opacity: 0; transform: translateY(-6px); transition: opacity 150ms var(--ease), transform 150ms var(--ease); }
  #view.entering { animation: enter 250ms var(--ease); }
  @keyframes enter { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }

  .site-foot {
    max-width: 680px; margin-inline: auto; padding: 0 24px 48px;
    font: 400 12px var(--mono); color: var(--muted);
  }

  :focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; border-radius: 4px; }
  .row:focus-visible, .btn:focus-visible, .link:focus-visible { outline-offset: 0; }

  @media (max-width: 720px) {
    .box { padding: 26px 22px; }
    .box + .box { margin-top: 64px; }
    #view { padding: 64px 0 48px; }
    h1 { font-size: 26px; }
    .row .row-year { display: none; }
  }

  @media (max-width: 1020px) { .social-rail { display: none; } }

  @media (prefers-reduced-motion: reduce) {
    html { scroll-behavior: auto; }
    .reveal { opacity: 1; transform: none; transition: none; }
    #view.leaving, #view.entering { animation: none; transition: none; opacity: 1; transform: none; }
    .row .row-arrow, .btn, .skip-link { transition: none; }
    .row:hover .row-arrow, .row:focus-visible .row-arrow { transform: none; }
    .btn:hover, .btn:focus-visible { transform: none; }
    .gcell img, .gcell::after, .gcell .gcap { transition: none; }
    .gcell:hover img { transform: none; }
  }
</style>
</head>

function esc(s) {
  return String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}

function mediaFigure(md) {
  const cls = md.portrait ? 'media portrait' : 'media';
  const body = /\.(mp4|mov|webm)$/i.test(md.src)
    ? `<video controls preload="none" playsinline poster="${esc(md.poster || '')}" src="${esc(md.src)}"></video>`
    : `<img loading="lazy" src="${esc(md.src)}" alt="${esc(md.caption || '')}">`;
  return `<figure class="${cls}">${body}${md.caption ? `<figcaption>${esc(md.caption)}</figcaption>` : ''}</figure>`;
}

function mountHome() {
  const boxes = document.querySelectorAll('.reveal');
  if (matchMedia('(prefers-reduced-motion: reduce)').matches) {
    boxes.forEach(b => b.classList.add('in'));
    return;
  }
  const io = new IntersectionObserver(entries => {
    entries.forEach(e => {
      if (e.isIntersecting) { e.target.classList.add('in'); io.unobserve(e.target); }
    });
  }, { threshold: 0.15 });
  boxes.forEach(b => io.observe(b));
}

// ── ROUTER ──
const view = document.getElementById('view');
const REDUCED = matchMedia('(prefers-reduced-motion: reduce)').matches;
let homeScrollY = 0;
let currentKind = null; // 'home' | 'project'

function routeTarget() {
  const raw = location.hash;
  if (raw === '' || raw === '#' || raw === '#/') return { kind: 'home' };
  if (raw === '#/me') return { kind: 'me' };
  if (raw.startsWith('#/')) {
    const i = SITE.projects.findIndex(p => p.slug === raw.slice(2));
    return i >= 0 ? { kind: 'project', i } : { kind: 'invalid' };
  }
  return { kind: 'anchor', id: raw.slice(1) };
}

function applyRoute() {
  const t = routeTarget();

  if (t.kind === 'invalid') { location.replace('#/'); return; }

  if (t.kind === 'anchor') {
    if (document.getElementById(t.id)) return; // browser handles in-page jump
    view.innerHTML = renderHome();
    mountHome();
    currentKind = 'home';
    document.title = 'Malek Hassan';
    requestAnimationFrame(() => document.getElementById(t.id)?.scrollIntoView());
    return;
  }

  if (currentKind === 'home' && (t.kind === 'project' || t.kind === 'me')) homeScrollY = scrollY;

  const swap = () => {
    if (t.kind === 'home') {
      view.innerHTML = renderHome();
      mountHome();
      document.title = 'Malek Hassan';
      const y = homeScrollY;
      requestAnimationFrame(() => scrollTo({ top: y, left: 0, behavior: 'instant' }));
      currentKind = 'home';
    } else if (t.kind === 'me') {
      view.innerHTML = renderMe();
      mountHome(); // wires .reveal observers (respects reduced motion)
      document.title = 'Malek Hassan — Me';
      requestAnimationFrame(() => scrollTo({ top: 0, left: 0, behavior: 'instant' }));
      currentKind = 'me';
    } else {
      view.innerHTML = renderProject(t.i);
      document.title = 'Malek Hassan — ' + SITE.projects[t.i].title;
      requestAnimationFrame(() => scrollTo({ top: 0, left: 0, behavior: 'instant' }));
      currentKind = 'project';
    }
  };

  document.querySelectorAll('.site-head nav a').forEach(a => {
    const me = a.getAttribute('href') === '#/me';
    a.toggleAttribute('aria-current', me ? t.kind === 'me' : t.kind === 'home');
  });

  if (REDUCED || currentKind === null) { swap(); return; }

  view.classList.add('leaving');
  setTimeout(() => {
    view.classList.remove('leaving');
    swap();
    view.classList.add('entering');
    setTimeout(() => view.classList.remove('entering'), 300);
  }, 150);
}

if ('scrollRestoration' in history) history.scrollRestoration = 'manual';
addEventListener('hashchange', applyRoute);
applyRoute();

// ── EDGE-CONSTRAINED WEAVE (WebGL) ──
(function initBackground() {
  const canvas = document.getElementById('bgCanvas');
  const gl = canvas.getContext('webgl') || canvas.getContext('experimental-webgl');
  if (!gl) { document.documentElement.classList.add('no-gl'); return; }

  const vs = `attribute vec4 aPos; void main(){ gl_Position = aPos; }`;

  const fs = `
    precision highp float;
    uniform vec2 u_res;
    uniform float u_time;
    uniform float u_band;
    uniform vec3 u_accent;

    vec3 mod289v3(vec3 x){return x-floor(x*(1.0/289.0))*289.0;}
    vec2 mod289v2(vec2 x){return x-floor(x*(1.0/289.0))*289.0;}
    vec3 permute(vec3 x){return mod289v3(((x*34.0)+1.0)*x);}

    float snoise(vec2 v){
      const vec4 C=vec4(0.211324865405187,0.366025403784439,-0.577350269189626,0.024390243902439);
      vec2 i=floor(v+dot(v,C.yy));
      vec2 x0=v-i+dot(i,C.xx);
      vec2 i1=(x0.x>x0.y)?vec2(1.0,0.0):vec2(0.0,1.0);
      vec4 x12=x0.xyxy+C.xxzz;
      x12.xy-=i1;
      i=mod289v2(i);
      vec3 p=permute(permute(i.y+vec3(0.0,i1.y,1.0))+i.x+vec3(0.0,i1.x,1.0));
      vec3 m=max(0.5-vec3(dot(x0,x0),dot(x12.xy,x12.xy),dot(x12.zw,x12.zw)),0.0);
      m=m*m; m=m*m;
      vec3 x2=2.0*fract(p*C.www)-1.0;
      vec3 h=abs(x2)-0.5;
      vec3 ox=floor(x2+0.5);
      vec3 a0=x2-ox;
      m*=1.79284291400159-0.85373472095314*(a0*a0+h*h);
      vec3 g;
      g.x=a0.x*x0.x+h.x*x0.y;
      g.yz=a0.yz*x12.xz+h.yz*x12.yw;
      return 130.0*dot(m,g);
    }

    void main(){
      vec2 st = gl_FragCoord.xy / u_res;
      st = st * 2.0 - 1.0;
      st.x *= u_res.x / u_res.y;
      float t = u_time * 0.12;

      float n1 = snoise(st * 1.5 + vec2(t, t * 0.5));
      float n2 = snoise(st * 2.5 - vec2(t * 0.8, -t * 0.3));
      vec2 warp = st + vec2(n1, n2) * 0.5;
      float dist = length(warp);
      float field = sin(dist * 20.0 - t * 5.0) + snoise(warp * 4.0) * 1.5;
      float bands = fract(field * 2.0);
      float lt = 0.15;
      float lines = smoothstep(lt, lt + 0.05, bands) * smoothstep(1.0 - lt, 1.0 - lt - 0.05, bands);

      float edgeDist = min(min(gl_FragCoord.x, u_res.x - gl_FragCoord.x),
                           min(gl_FragCoord.y, u_res.y - gl_FragCoord.y));
      float edgeFactor = pow(1.0 - smoothstep(0.0, u_band, edgeDist), 1.8);
      lines *= edgeFactor * 0.8;

      float grain = fract(sin(dot(gl_FragCoord.xy, vec2(12.9898, 78.233))) * 43758.5453);

      vec3 bg   = vec3(0.0196, 0.0196, 0.0196);
      vec3 vein = vec3(0.13, 0.13, 0.13);
      float shimmer = 0.35 + 0.65 * snoise(warp * 2.0 + t * 0.3);
      vec3 veinCol = mix(vein, u_accent * 0.75, clamp(edgeFactor * shimmer, 0.0, 0.38));
      vec3 col = mix(bg, veinCol, lines);
      col -= grain * 0.015;

      gl_FragColor = vec4(col, 1.0);
    }
  `;

  function compileShader(type, src) {
    const s = gl.createShader(type);
    gl.shaderSource(s, src); gl.compileShader(s);
    if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) { gl.deleteShader(s); return null; }
    return s;
  }

  const vsObj = compileShader(gl.VERTEX_SHADER, vs);
  const fsObj = compileShader(gl.FRAGMENT_SHADER, fs);
  if (!vsObj || !fsObj) { document.documentElement.classList.add('no-gl'); return; }

  const prog = gl.createProgram();
  gl.attachShader(prog, vsObj);
  gl.attachShader(prog, fsObj);
  gl.linkProgram(prog); gl.useProgram(prog);

  const buf = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, buf);
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,1, 1,1, -1,-1, 1,-1]), gl.STATIC_DRAW);
  const aPos = gl.getAttribLocation(prog, 'aPos');
  gl.enableVertexAttribArray(aPos);
  gl.vertexAttribPointer(aPos, 2, gl.FLOAT, false, 0, 0);

  const uRes    = gl.getUniformLocation(prog, 'u_res');
  const uTime   = gl.getUniformLocation(prog, 'u_time');
  const uBand   = gl.getUniformLocation(prog, 'u_band');
  const uAccent = gl.getUniformLocation(prog, 'u_accent');

  const accentHex = getComputedStyle(document.documentElement).getPropertyValue('--accent').trim();
  const accent = [1, 3, 5].map(i => parseInt(accentHex.slice(i, i + 2), 16) / 255);
  gl.uniform3f(uAccent, accent[0], accent[1], accent[2]);

  function resize() {
    const dpr = window.devicePixelRatio || 1;
    const w = Math.floor(window.innerWidth * dpr), h = Math.floor(window.innerHeight * dpr);
    if (canvas.width !== w || canvas.height !== h) {
      canvas.width = w; canvas.height = h;
      gl.viewport(0, 0, w, h);
      const band = (window.innerWidth < 720 ? 90 : 180) * dpr;
      gl.uniform1f(uBand, band);
    }
  }

  function render(ms) {
    resize();
    gl.uniform2f(uRes, canvas.width, canvas.height);
    gl.uniform1f(uTime, ms * 0.001);
    gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
    requestAnimationFrame(render);
  }

  requestAnimationFrame(render);
})();

// ── CURSOR SPOTLIGHT ──
(function initSpotlight() {
  const el = document.getElementById('spotlight');
  if (!el || matchMedia('(hover: none)').matches) return;
  const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
  let tx = innerWidth / 2, ty = innerHeight * 0.3, x = tx, y = ty;

  addEventListener('pointermove', e => { tx = e.clientX; ty = e.clientY; }, { passive: true });

  function frame() {
    if (reduced) { x = tx; y = ty; }
    else { x += (tx - x) * 0.12; y += (ty - y) * 0.12; }
    el.style.setProperty('--mx', x + 'px');
    el.style.setProperty('--my', y + 'px');
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
